[custom]
; Mobile Mihomo profile: large rule providers are precompiled as MRS.
; The rule bundle is served by this converter through getLink().
enable_rule_generator=false
overwrite_original_rules=false
clash_rule_base=base/loyalsoldier_mihomo_mobile.yml

custom_proxy_group=PROXY`select`[]AUTO`[]JP`[]US`[]DIRECT`.*
custom_proxy_group=AUTO`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=JP`select`(?i)(日本|东京|大阪|jp|japan|tokyo|osaka)`[]DIRECT
custom_proxy_group=US`select`(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|西雅图|西雅圖|纽约|紐約|us|usa|united states|america|los angeles|san jose|seattle|new york)`[]DIRECT

add_emoji=true
remove_old_emoji=true
