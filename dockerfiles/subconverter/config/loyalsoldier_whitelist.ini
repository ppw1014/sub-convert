[custom]
; 基于 Loyalsoldier/clash-rules 的 Clash/Mihomo 白名单规则。
; 适合日常使用：国内与局域网直连，广告拒绝，Google/Telegram/代理列表和漏网流量走代理。
; 规则源：https://github.com/Loyalsoldier/clash-rules

ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,claude.ai),(NETWORK,UDP))
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,claude.com),(NETWORK,UDP))
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,anthropic.com),(NETWORK,UDP))
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,nexovcc.com),(NETWORK,UDP))
ruleset=DIRECT,clash-classic:https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt,86400
ruleset=DIRECT,[]DOMAIN,clash.razord.top
ruleset=DIRECT,[]DOMAIN,yacd.haishan.me
; 微信 / 腾讯直连规则：包含 macOS/Windows 进程匹配与多媒体 CDN 域名。
ruleset=DIRECT,[]PROCESS-NAME,WeChat
ruleset=DIRECT,[]PROCESS-NAME,WeChatAppEx
ruleset=DIRECT,[]PROCESS-NAME,WeChatAppEx Helper
ruleset=DIRECT,[]PROCESS-NAME,WeChatAppEx Helper (Renderer)
ruleset=DIRECT,[]PROCESS-NAME,WeChatAppEx Helper (GPU)
ruleset=DIRECT,[]PROCESS-PATH-REGEX,(?i).*wechat.*
ruleset=DIRECT,[]PROCESS-PATH-REGEX,(?i).*weixin.*
