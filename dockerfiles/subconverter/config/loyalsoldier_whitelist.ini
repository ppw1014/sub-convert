; 精选自 VPSDance/ai-proxy-rules：只保留 AI Core、专用网络和必要依赖。
; 拦截 Claude/Anthropic 的 QUIC(UDP 443)：逼浏览器回落 TCP，让 Claude 流量单一出口走代理，避免混源触发风控。
; 逻辑规则仅 mihomo/Clash Meta 内核支持，Shadowrocket 配置不添加。
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,claude.ai),(NETWORK,UDP))
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,claude.com),(NETWORK,UDP))
ruleset=REJECT,[]AND,((DOMAIN-SUFFIX,anthropic.com),(NETWORK,UDP))

