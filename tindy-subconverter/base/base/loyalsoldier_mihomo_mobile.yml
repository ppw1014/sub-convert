port: 7890
socks-port: 7891
allow-lan: false
mode: Rule
log-level: warning
ipv6: false
external-controller: 127.0.0.1:9090
proxies: ~
proxy-groups: ~
rule-providers:
  private:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/private.mrs") }}'
    path: ./providers/loyalsoldier-mobile-private.mrs
    interval: 86400
  reject:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/reject.mrs") }}'
    path: ./providers/loyalsoldier-mobile-reject.mrs
    interval: 86400
  icloud:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/icloud.mrs") }}'
    path: ./providers/loyalsoldier-mobile-icloud.mrs
    interval: 86400
  apple:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/apple.mrs") }}'
    path: ./providers/loyalsoldier-mobile-apple.mrs
    interval: 86400
  google:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/google.mrs") }}'
    path: ./providers/loyalsoldier-mobile-google.mrs
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/proxy.mrs") }}'
    path: ./providers/loyalsoldier-mobile-proxy.mrs
    interval: 86400
  direct:
    type: http
    behavior: domain
    format: mrs
    url: '{{ getLink("/mobile-rules/direct.mrs") }}'
    path: ./providers/loyalsoldier-mobile-direct.mrs
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    format: mrs
    url: '{{ getLink("/mobile-rules/lancidr.mrs") }}'
    path: ./providers/loyalsoldier-mobile-lancidr.mrs
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    format: mrs
    url: '{{ getLink("/mobile-rules/cncidr.mrs") }}'
    path: ./providers/loyalsoldier-mobile-cncidr.mrs
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    format: mrs
    url: '{{ getLink("/mobile-rules/telegramcidr.mrs") }}'
    path: ./providers/loyalsoldier-mobile-telegramcidr.mrs
    interval: 86400
